<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Tasty Cakery</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <p class="section-label">TASTY CAKERY</p>

            <h1>Admin Login</h1>

            <p class="admin-login-intro">
                Sign in to manage the Tasty Cakery cake gallery.
            </p>

            <form id="admin-login-form">

                <div class="admin-form-group">
                    <label for="admin-email">Email</label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="admin-form-group">
                    <label for="admin-password">Password</label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="admin-login-button">
                    Sign In
                </button>

                <p id="login-message" class="admin-login-message"></p>

            </form>

        </div>

    </main>
<script type="module" src="../js/admin-login.js"></script>
</body>

</html>
